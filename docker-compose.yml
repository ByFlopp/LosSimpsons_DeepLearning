# Levanta Jupyter Lab con la GPU del host y el repositorio montado en /workspace.
#
# El dataset (una carpeta por personaje) se monta en solo lectura desde la ruta de
# SIMPSONS_DATASET_HOST, que se define en un archivo .env junto a este (ver .env.example):
#   SIMPSONS_DATASET_HOST=C:/Users/<usuario>/Desktop/simpsons_dataset/simpsons_dataset
#
# El script de alteraciones escribe en el dataset, así que no se ejecuta en este servicio;
# se ejecuta en el host o con la misma imagen y el dataset montado con escritura
# (los pasos están en notebooks/newDataset/README.md).

services:
  jupyter:
    build: .
    image: simpsons-pmc:gpu
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
      - ${SIMPSONS_DATASET_HOST:?Define SIMPSONS_DATASET_HOST en .env (ver .env.example)}:/data/simpsons_dataset:ro
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
